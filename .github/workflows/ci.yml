name: ci

# Lint + test on every PR and push to main. The image is built and pushed to
# GHCR only after all test jobs (go, proto, eval) pass, and only on main —
# never on PRs.
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: the workflow token gets read-only repo access. Only
# build-push adds packages: write, to push the image with GITHUB_TOKEN.
permissions:
  contents: read

# Cancel superseded runs on the same PR. Each push to main gets a group of its
# own, so no main run is cancelled or replaced while waiting, and every green
# merge publishes its image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The engine links libvips via CGO; install the dev package so `go vet` and
      # the tests compile and run instead of failing to build.
      - name: Install libvips (CGO backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev pkg-config

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^gen/'))"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      # All application logging goes through log/slog (CON-107). Boot log.Fatal*
      # in cmd/image-service is allowed; log.Print/Printf/Println calls are not.
      # Anchored on the call paren so prose mentions of the funcs don't trip it.
      - name: forbid stdlib log.Print calls
        run: |
          if git grep -nE 'log\.Print(ln|f)?\(' -- cmd internal; then
            echo "::error::use log/slog, not the stdlib log.Print/Printf/Println functions"
            exit 1
          fi

      - name: vet
        run: go vet ./...
        env:
          CGO_ENABLED: "1"

      - name: test
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1

      # image.v1 lives in the SHARED buf.build/ogen-app/proto module (CON-220),
      # not in this repo. Verify the committed stubs under gen/ are in sync with
      # the pinned contract — a drifted checkout means someone bumped
      # PROTO_VERSION without regenerating. Plugin versions are pinned to those in
      # the generated headers so regeneration is byte-identical.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify generated code is up to date
        run: |
          make proto
          if [ -n "$(git status --porcelain -- gen/)" ]; then
            echo "::error::gen/ is out of date — run 'make proto' and commit the result"
            git status --porcelain -- gen/
            git diff -- gen/
            exit 1
          fi

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install libvips (CGO backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev pkg-config
      # The golden eval set gates model/prompt changes (NFR). It runs against the
      # real Gemini model, so it needs GEMINI_API_KEY; when the secret is absent
      # (e.g. a fork PR) the harness SKIPS rather than failing, so the gate is
      # advisory on forks and enforced on the canonical repo.
      - name: eval gate
        run: go test -race -tags=eval ./eval/...
        env:
          CGO_ENABLED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Every green main push publishes ghcr.io/ogen-app/image-service:<build>,
  # where build is the commit count on main, then asks ogen-release to bump
  # image-service to it.
  build-push:
    runs-on: ubuntu-latest
    # Gate the image on tests: this job won't start until go, proto, and eval
    # succeed (needs implies success). Skip on PRs and on forks.
    needs: [go, proto, eval]
    if: github.event_name == 'push' && github.repository_owner == 'ogen-app'
    # Runs of back-to-back merges can publish out of order: build 101 may push
    # and dispatch before build 100. Each build has its own tag, so the
    # registry doesn't care, and ogen-release ignores a bump to a build lower
    # than the one it holds.
    permissions:
      contents: read
      packages: write
    steps:
      # Full history: the build number is the commit count, which a shallow
      # clone reports as 1.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repo, which is what lets
      # GITHUB_TOKEN push to it.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ogen-app/image-service:${{ steps.build.outputs.number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ogen-app/image-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release App's token, limited to ogen-release, sends the bump. Both
      # steps are best effort: a missing App or ogen-release must not fail main.
      - name: Release App token
        id: release-token
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ogen-app
          repositories: ogen-release
          permission-contents: write

      - name: Dispatch bump to ogen-release
        if: steps.release-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          gh api repos/ogen-app/ogen-release/dispatches \
            -f event_type=bump \
            -f 'client_payload[service]=image-service' \
            -F "client_payload[build]=$BUILD" \
            -f "client_payload[revision]=$GITHUB_SHA"
